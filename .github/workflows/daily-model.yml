name: Daglig modell

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 norsk sommertid (CEST). Om vinteren (CET)
                           # blir dette 06:00 lokalt - GitHub Actions cron kjenner ikke
                           # sommertid, så det driver ±1t i vintersesongen.
  workflow_dispatch: {}    # lar deg kjøre manuelt fra Actions-fanen

permissions:
  contents: write          # trengs for å committe data/today.json

# Datajobbene (denne og "Odds før kamp") skriver til samme filer: kjør én om gangen, ikke samtidig.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sjekk resultater for tidligere kamper
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/check-results.js

      - name: Bygg modell
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/build-model.js

      - name: Hent morgen-odds for dagens kamper
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MODE: morning
        run: node scripts/fetch-odds.js

      - name: Commit oppdatert data
        run: |
          git config user.name  "kampanalyse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          git commit -m "Daglig modell $(date -u +%Y-%m-%d)" || echo "Ingen endring"
          # Andre kan ha pushet mens jobben kjørte (din push, odds-jobben): hent og legg våre data oppå, prøv igjen
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || { sleep 5; git pull --rebase -X theirs origin main && git push; }
