name: Odds før kamp

on:
  schedule:
    # Hver halvtime i typisk kamp-vindu (9-23 UTC - dekker tidlige lørdagskamper
    # kl 12:30 britisk tid, som er kl 11:30 UTC). Scriptet henter selv bare for
    # kamper som er ~1t unna avspark, så de fleste kjøringer gjør ingenting.
    - cron: '*/30 9-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Datajobbene (denne og "Daglig modell") skriver til samme filer: kjør én om gangen, ikke samtidig.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hent odds for kamper i vinduet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.js

      - name: Sjekk dagens resultater (samme dag, ~2t20min etter avspark)
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/check-results.js

      - name: Commit oppdaterte odds/resultater
        run: |
          git config user.name  "kampanalyse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          git commit -m "Odds/resultat-oppdatering $(date -u +%H:%M)" || echo "Ingen endring"
          # Andre kan ha pushet mens jobben kjørte: hent og legg våre data oppå, prøv igjen
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || { sleep 5; git pull --rebase -X theirs origin main && git push; }
