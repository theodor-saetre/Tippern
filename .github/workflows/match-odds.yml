name: Odds før kamp

on:
  schedule:
    # Hver halvtime i typisk kamp-vindu (12–23 UTC). Scriptet henter selv
    # bare for kamper som er ~1t unna avspark, så de fleste kjøringer gjør ingenting.
    - cron: '*/30 12-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hent odds for kamper i vinduet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.js

      - name: Commit oppdaterte odds
        run: |
          git config user.name  "kampanalyse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/today.json data/archive/
          git commit -m "Odds-oppdatering $(date -u +%H:%M)" || echo "Ingen endring"
          git push
